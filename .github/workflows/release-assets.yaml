name: release-assets

on:
  push:
    branches:
      - stable
    tags:
      - 'v*'
    paths:
      - main.go
  # 手动补齐漏发的 Release: 指定 tag 即可重跑构建与上传, 不必删标签重推。
  workflow_dispatch:
    inputs:
      tag:
        description: 要重建产物的 tag(例如 v0.21.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: revision
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.revision.outputs.sha }}

  release-assets:
    name: Build and upload release archives
    runs-on: ubuntu-latest
    needs: [revision, tests]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VERSION="$(bash scripts/version.sh)"
          TAG="${INPUT_TAG:-$VERSION}"
          if [ "$REF_TYPE" = tag ] && [ -z "$INPUT_TAG" ]; then TAG="$REF_NAME"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" != "$VERSION" ]]; then
            echo "::error::Release ref $TAG does not match source version $VERSION"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
          run_install: false

      - name: Build frontend
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.tag.outputs.tag }}
          VITE_GITHUB_REPO: https://github.com/alvindingpeng/tokenmarket
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Refresh model prices
        run: python3 scripts/updatePrice.py

      - name: Build release archives
        env:
          SKIP_ANDROID: '1'
          SWITCHYARD_BUILD_VERSION: ${{ steps.tag.outputs.tag }}
        run: bash scripts/build.sh

      - name: Check release binary version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ACTUAL="$(build/bin/switchyard-linux-amd64 version | awk '$1 == "Version:" { print $2 }')"
          test "$ACTUAL" = "$TAG"

      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
            gh release upload "$TAG" build/archives/* --clobber
          else
            awk -v tag="$TAG" '$1 == "##" { if (found) exit; if ($2 == tag) found=1; next } found' CHANGELOG.md > release-notes.md
            test -s release-notes.md
            gh release create "$TAG" build/archives/* --target "$SHA" --title "$TAG" --notes-file release-notes.md
          fi
