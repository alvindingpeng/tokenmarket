<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eae9e3" />
    <meta name="application-name" content="Switchyard" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Switchyard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-title" content="Switchyard" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-icon.png" />
    <title>Switchyard</title>
    <script>
      const theme = localStorage.getItem('theme');
      const isDark =
        theme === 'dark' ||
        ((theme === null || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const root = document.documentElement;
      root.classList.toggle('dark', isDark);
      root.style.colorScheme = isDark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content',
        isDark ? '#413a2c' : '#eae9e3',
      );
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.9331 0.0081 98.8844);
        color: oklch(0.6205 0.1199 144.8607);
        transition: opacity 200ms ease;
      }
      html.dark #initial-loader {
        background: oklch(0.2809 0.0264 153.4040);
        color: oklch(0.6990 0.1292 144.8727);
      }
      #initial-loader.octo-hide {
        opacity: 0;
        pointer-events: none;
      }
      #initial-loader svg {
        width: 120px;
        height: 120px;
      }
      #initial-loader .logo-group {
        animation: logoFade 2s ease-in-out infinite;
      }
      /* 股道用描边绘制: 两条上游股道先后并入主干, 再统一发出。 */
      #initial-loader .logo-link {
        fill: none;
        stroke: currentColor;
        stroke-width: 13;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: logoDraw 2s ease-in-out infinite both;
      }
      #initial-loader .logo-link-b {
        animation-delay: 160ms;
      }

      @keyframes logoDraw {
        0%   { stroke-dashoffset: 1; opacity: 0; }
        10%  { opacity: 1; }
        42%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes logoFade {
        0%   { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader .logo-group,
        #initial-loader .logo-link {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="initial-loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g class="logo-group">
          <path class="logo-link" pathLength="1" d="M30 12 V40 L50 58 V88" />
          <path class="logo-link logo-link-b" pathLength="1" d="M70 12 V40 L50 58" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
